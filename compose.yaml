name: rawgravel
services:
  rawgravel:
    build: .
    container_name: rawgravel
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://wallet.example.com
      PUBLIC_ACCESS: "true"
    secrets:
      - source: wallet
        target: wallet.json
    networks:
      - public24
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: public24
      traefik.http.routers.rawgravel.rule: Host(`wallet.example.com`)
      traefik.http.routers.rawgravel.entrypoints: websecure
      traefik.http.routers.rawgravel.tls: "true"
      traefik.http.routers.rawgravel.tls.certresolver: lealpn
      traefik.http.services.rawgravel.loadbalancer.server.port: "3000"
secrets:
  wallet:
    file: ./secrets/wallet.json
networks:
  public24:
    external: true
